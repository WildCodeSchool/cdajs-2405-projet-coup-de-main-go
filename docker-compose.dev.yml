services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile.dev
        restart: unless-stopped
        environment:
            APOLLO_PORT: ${APOLLO_PORT}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_DATABASE: ${DB_DATABASE}
            JWT_SECRET: ${JWT_SECRET}
        ports:
            - 4000:4000
        volumes:
            - ./backend:/server
            - /server/node_modules
        depends_on:
            - postgres

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile.dev
        restart: unless-stopped
        environment:
            VITE_BACKEND_URL: ${VITE_BACKEND_URL}
            VITE_DOMAIN_BACKEND_URL: ${VITE_DOMAIN_BACKEND_URL}
            VITE_POLL_CHAT_INTERVAL: ${VITE_POLL_CHAT_INTERVAL}
            JWT_SECRET: ${JWT_SECRET}
            NODE_ENV: development
        ports:
            - 5173:5173
        volumes:
            - ./frontend:/client
            - /client/node_modules
            - web-client-build:/client/build
        depends_on:
            - backend

    e2e:
        build:
            context: ./e2e
            dockerfile: Dockerfile
        environment:
            VITE_FRONTEND_URL: ${VITE_FRONTEND_URL}
            CI: true
        volumes:
            - ./e2e:/e2e
            - /e2e/node_modules
        depends_on:
            - backend
            - frontend
        ports:
            - 9000:9000

    postgres:
        image: postgres:alpine
        restart: unless-stopped
        shm_size: 128mb
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        ports:
            - 5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data

    adminer:
        image: adminer
        restart: always
        ports:
            - 8080:8080

    nginx:
        image: nginx:1.21.3
        depends_on:
            - backend
            - frontend
        restart: always
        ports:
            - ${GATEWAY_PORT:-8000}:80
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./logs:/var/log/nginx
            - web-client-build:/web-client-build

    redis:
        hostname: redis
        image: redis

    redis-commander:
        image: rediscommander/redis-commander:latest
        platform: linux/amd64
        restart: always
        ports:
            - 8081:8081
        environment:
            - REDIS_HOSTS=redis
        depends_on:
            - redis

volumes:
    postgres-data:
    web-client-build:
