services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        healthcheck:
            test: "curl --fail --silent --show-error http://backend:4000/health || exit 1"
            interval: 5s
            timeout: 5s
            retries: 10
        environment:
            APOLLO_PORT: ${APOLLO_PORT}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_DATABASE: ${DB_DATABASE}
            JWT_SECRET: ${JWT_SECRET}
        ports:
            - 4000:4000
        volumes:
            - ./backend:/server
            - /server/node_modules
        depends_on:
            postgres:
                condition: service_healthy

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        healthcheck:
            test: "curl --fail --request GET --url 'http://frontend:5173' || exit 1"
            interval: 5s
            timeout: 5s
            retries: 10
        environment:
            VITE_BACKEND_URL: http://backend:4000/graphql
            VITE_DOMAIN_BACKEND_URL: http://backend:4000
            VITE_POLL_CHAT_INTERVAL: ${VITE_POLL_CHAT_INTERVAL}
            JWT_SECRET: ${JWT_SECRET}
            NODE_ENV: development
        ports:
            - 5173:5173
        volumes:
            - ./frontend:/client
            - /client/node_modules
        depends_on:
            backend:
                condition: service_healthy

    e2e:
        build:
            context: ./e2e
            dockerfile: Dockerfile
        environment:
            VITE_FRONTEND_URL: http://frontend:5173/
            CI: true
        volumes:
            - ./e2e:/e2e
            - /e2e/node_modules
        depends_on:
            - backend
            - frontend
        ports:
            - 9000:9000
        command: sh -c "npx playwright test && tail -f /dev/null"
        
    postgres:
        image: postgres:alpine
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d postgres -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 20
        shm_size: 128mb
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            POSTGRES_DB: ${DB_DATABASE}
        ports:
            - 5432:5432
        volumes:
            - postgres-data:/var/lib/postgresql/data

    adminer:
        image: adminer
        restart: always
        ports:
            - 8080:8080

    nginx:
        image: nginx:1.21.3
        depends_on:
            - backend
            - frontend
        restart: always
        ports:
            - ${GATEWAY_PORT:-8000}:80
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf
            - ./logs:/var/log/nginx

    redis:
        hostname: redis
        image: redis

    redis-commander:
        image: rediscommander/redis-commander:latest
        platform: linux/amd64
        restart: always
        ports:
            - 8081:8081
        environment:
            - REDIS_HOSTS=redis
        depends_on:
            - redis

volumes:
    postgres-data:
